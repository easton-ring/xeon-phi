[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "knc_rf_lab"
version = "0.1.0"
description = "Reproducible RF DSP / modulation-classification benchmarks: modern host CPU vs Intel Xeon Phi 5110P (Knights Corner)"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "pyyaml>=6"]

[project.optional-dependencies]
ml = ["scikit-learn>=1.3"]
plot = ["matplotlib>=3.7"]
# UNVERIFIED on this project's CI: see docs/torchsig.md
torchsig = ["torchsig==2.2.0"]
dev = ["pytest>=7", "scikit-learn>=1.3", "matplotlib>=3.7"]

[project.scripts]
knc-rf-lab = "knc_rf_lab.cli:main"

[tool.setuptools.packages.find]
where = ["python"]

[tool.setuptools.package-data]
knc_rf_lab = ["schemas/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
